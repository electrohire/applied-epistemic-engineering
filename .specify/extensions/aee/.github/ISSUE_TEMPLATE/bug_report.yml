name: Bug report
description: Report a reproducible problem in the AEE Spec Kit extension.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the AEE extension.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command or hook, input artifact, and sanitized output.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the AEE extension, Evaluator extension, Spec Kit, Python, and applied-epistemic-engineering package versions.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system and installation method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste logs or sanitized evaluator output here.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
