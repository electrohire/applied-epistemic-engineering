site_name: Applied Epistemic Engineering
site_description: Evidence-centered claim engineering for Python and Spec Kit.
site_url: https://applied-epistemic-engineering.readthedocs.io
repo_url: https://github.com/electrohire/applied-epistemic-engineering
repo_name: applied-epistemic-engineering
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - Guides:
      - CLI, agent, and Spec Kit: agent.md
      - Use cases and agent loops: use-cases.md
      - Spec Kit integration: spec-kit.md
  - Concepts:
      - Foundations: concepts.md
      - Names and assurance boundaries: names-and-assurance.md
      - Scoring: scoring.md
      - Ledger: ledger.md
  - Reference:
      - Python API: api.md
      - Version policy: versioning.md
  - Security: security.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            members_order: source

strict: true
