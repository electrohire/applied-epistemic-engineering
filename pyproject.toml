[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "applied-epistemic-engineering"
version = "1.0.0"
description = "Evidence-centered claim evaluation, adversarial challenge, recovery, and tamper-evident epistemic records."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ElectroHire Inc."}]
keywords = [
  "applied-epistemic-engineering",
  "aee",
  "evidence",
  "provenance",
  "uncertainty",
  "ai-governance",
  "spec-driven-development",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.scripts]
aee = "aee.cli:main"

[project.urls]
Homepage = "https://github.com/electrohire/applied-epistemic-engineering"
Documentation = "https://applied-epistemic-engineering.readthedocs.io"
Repository = "https://github.com/electrohire/applied-epistemic-engineering"
Changelog = "https://github.com/electrohire/applied-epistemic-engineering/blob/main/CHANGELOG.md"
Issues = "https://github.com/electrohire/applied-epistemic-engineering/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aee"]

[tool.hatch.build.targets.sdist]
include = ["src/aee", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "mkdocs.yml", ".readthedocs.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aee"]

