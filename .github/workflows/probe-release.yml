name: probe-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create probe release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.0.0-wfprobe" --repo electrohire/applied-epistemic-engineering --target 41e7cf0cce4a6043a6d18de945d66911c65789f7 --title "v0.0.0-wfprobe"
