name: Bug report
description: Report a reproducible problem in Applied Epistemic Engineering.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Applied Epistemic Engineering.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest example or sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and installation method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste logs, tracebacks, or sanitized assessment data here.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
